name: Production Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      server:
        description: "server_id 或 all"
        required: true
        default: "all"
        type: string
      service:
        description: "服务范围"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - gateway
          - message-api
          - websocket-node
      endpoint:
        description: "endpoint_id 或 all"
        required: true
        default: "all"
        type: string

# CI 级串行化与远端部署锁共同防止并发生产发布。
concurrency:
  group: socket-server-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Rolling deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # 建议在仓库设置中为 production 环境配置审批人。
    environment: production
    env:
      TARGETS_FILE: runtime/ci/targets.json
      APP_CONFIG: runtime/ci/app.json
      RUNTIME_ENV: runtime/ci/runtime.env
      PACKAGE_FILE: runtime/package/socket-server.tar.gz
      BUILD_DIR: runtime/build
      SSH_CONTROL_DIR: runtime/ci/ssh-control
      SSH_MULTIPLEX: "1"
      DEPLOY_HEALTH_TIMEOUT_SECONDS: "30"
      DEPLOY_DRAIN_TIMEOUT_SECONDS: "30"
      DEPLOY_RETAIN_RELEASES: "5"
      GIT_COMMIT: ${{ github.sha }}
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      SSH_OPTS: "-i /home/runner/.ssh/socket_server_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/home/runner/.ssh/known_hosts"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare protected deployment files
        shell: bash
        env:
          APP_CONFIG_B64: ${{ secrets.APP_CONFIG_B64 }}
          DEPLOY_TARGETS_B64: ${{ secrets.DEPLOY_TARGETS_B64 }}
          RUNTIME_ENV_B64: ${{ secrets.RUNTIME_ENV_B64 }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p runtime/ci "$HOME/.ssh"

          # 必需 Secret 缺失时在连接生产服务器前直接失败。
          for name in APP_CONFIG_B64 DEPLOY_TARGETS_B64 SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "required secret is empty: $name" >&2
              exit 1
            fi
          done

          printf '%s' "$APP_CONFIG_B64" | base64 --decode > runtime/ci/app.json
          printf '%s' "$DEPLOY_TARGETS_B64" | base64 --decode > runtime/ci/targets.json
          if [ -n "${RUNTIME_ENV_B64:-}" ]; then
            printf '%s' "$RUNTIME_ENV_B64" | base64 --decode > runtime/ci/runtime.env
          fi
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/socket_server_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/socket_server_deploy" "$HOME/.ssh/known_hosts"

      - name: Test and deploy
        shell: bash
        run: |
          bash deploy/ci-deploy.sh \
            "${{ inputs.server || 'all' }}" \
            "${{ inputs.service || 'all' }}" \
            "${{ inputs.endpoint || 'all' }}"
